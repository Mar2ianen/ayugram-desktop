name: "Build (Linux/Nix)"
run-name: "build"

on:
  push:
    branches: [rebase-telegram-desktop-7]
    paths:
      - '**/*.nix'
      - '**/*.lock'
      - '**/*.patch'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '**/*.nix'
      - '**/*.lock'
      - '**/*.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ayugram-desktop (${{ matrix.system }})
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0ATULk5KPsnPonf3dmAxxEXG5kS54Y=

      - name: flake check
        run: nix flake check --no-write-lock-file .#

      - name: Build ayugram-desktop
        id: build
        run: |
          nix --print-build-logs build .#packages.${{ matrix.system }}.ayugram-desktop
          SP=$(readlink result)
          echo "store_path=$SP" >> $GITHUB_OUTPUT
          echo "Built: $SP"
          ls -la "$SP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-desktop-linux
          path: ${{ steps.build.outputs.store_path }}
          retention-days: 14
          if-no-files-found: error
